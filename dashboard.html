<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>M3U8 Language Mapper — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --accent: #7c6af7;
    --accent2: #56cfb2;
    --text: #e2e8f0;
    --muted: #8892a4;
    --border: #2d3248;
    --ok: #4ade80;
    --err: #f87171;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1a1d27 0%, #232635 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .refresh-info { font-size: 0.78rem; color: var(--muted); }

  /* ── Layout ── */
  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── Stat cards ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .card .value { font-size: 2rem; font-weight: 700; color: var(--text); }
  .card .value.accent  { color: var(--accent); }
  .card .value.accent2 { color: var(--accent2); }
  .card .value.ok      { color: var(--ok); }
  .card .value.err     { color: var(--err); }

  /* ── Chart + table row ── */
  .grid2 {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    margin-bottom: 28px;
    align-items: start;
  }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  .card.chart-card { padding: 24px; }
  .card.chart-card h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .04em; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th {
    background: var(--surface2);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: .06em;
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { opacity: 0.4; margin-left: 4px; }
  thead th.asc  .sort-arrow { opacity: 1; content: '↑'; }
  thead th.desc .sort-arrow { opacity: 1; content: '↓'; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .url-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); font-size: 0.8rem; }
  .lang-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
  }
  .status-ok  { color: var(--ok);  font-weight: 600; }
  .status-err { color: var(--err); font-weight: 600; }
  .conf-bar { display: flex; align-items: center; gap: 8px; }
  .conf-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .conf-fill  { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width .4s; }

  /* ── Toolbar ── */
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
    flex: 1;
    min-width: 200px;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .toolbar select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

  /* ── State messages ── */
  .loading, .error-msg, .no-sheet {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 1rem;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .no-sheet a { color: var(--accent); }

  /* ── Pagination ── */
  .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-btn:disabled { opacity: .4; cursor: default; }

  /* ── Footer ── */
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 32px; }
</style>
</head>
<body>

<header>
  <h1>🎙️ M3U8 Language Mapper</h1>
  <span class="refresh-info">Auto-refreshes every 5 min &nbsp;|&nbsp; <span id="last-updated">—</span></span>
</header>

<main>

  <!-- Stat cards -->
  <div class="stats" id="stats">
    <div class="card"><div class="label">Total Streams</div><div class="value accent" id="stat-total">—</div></div>
    <div class="card"><div class="label">Successful</div><div class="value ok"   id="stat-ok">—</div></div>
    <div class="card"><div class="label">Failed</div><div class="value err"      id="stat-err">—</div></div>
    <div class="card"><div class="label">Languages Found</div><div class="value accent2" id="stat-langs">—</div></div>
    <div class="card"><div class="label">Avg Confidence</div><div class="value" id="stat-conf">—</div></div>
  </div>

  <div class="grid2">
    <!-- Chart -->
    <div class="card chart-card">
      <h2>Language Distribution</h2>
      <canvas id="langChart" height="300"></canvas>
    </div>

    <!-- Table card -->
    <div class="card">
      <div class="toolbar">
        <input type="text"   id="search-box"    placeholder="🔍  Search URL or language…" oninput="applyFilters()"/>
        <select id="lang-filter" onchange="applyFilters()">
          <option value="">All languages</option>
        </select>
        <select id="status-filter" onchange="applyFilters()">
          <option value="">All statuses</option>
          <option value="ok">OK</option>
          <option value="error">Error</option>
        </select>
        <button class="btn secondary" onclick="refreshData()">↻ Refresh</button>
      </div>

      <div id="table-container">
        <div class="loading"><div class="spinner"></div>Loading data…</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

</main>

<footer>M3U8 Language Mapper &nbsp;·&nbsp; Powered by Whisper AI &nbsp;·&nbsp; Dashboard auto-generated</footer>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const SHEET_URL = '';
const PAGE_SIZE = 20;
const REFRESH_MS = 5 * 60 * 1000;

// ── State ─────────────────────────────────────────────────────────────────
let allRows      = [];
let filteredRows = [];
let currentPage  = 1;
let chartInst    = null;
let sortCol      = 'timestamp';
let sortDir      = 'desc';

// Palette for chart
const PALETTE = [
  '#7c6af7','#56cfb2','#f6a050','#f87171','#60a5fa',
  '#a78bfa','#34d399','#fbbf24','#fb923c','#818cf8',
];

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (!SHEET_URL) {
    document.getElementById('table-container').innerHTML = `
      <div class="no-sheet">
        <p>No Google Sheet URL configured.</p>
        <p style="margin-top:8px;font-size:.85rem;">
          Set <code>GOOGLE_SHEET_URL</code> in your <code>.env</code> and run
          <code>python main.py --update-dashboard</code>.
        </p>
      </div>`;
    return;
  }
  refreshData();
  setInterval(refreshData, REFRESH_MS);
});

// ── Fetch & parse CSV from Google Sheets ─────────────────────────────────
async function refreshData() {
  try {
    const res  = await fetch(SHEET_URL + '&t=' + Date.now());
    const text = await res.text();
    allRows    = parseCSV(text);
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();
    populateLangFilter();
    applyFilters();
    updateStats();
    updateChart();
  } catch (e) {
    document.getElementById('table-container').innerHTML =
      `<div class="error-msg">⚠️  Failed to load data:<br><code>${e.message}</code></div>`;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    // Simple CSV parse (handles quoted commas)
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    const row = {};
    headers.forEach((h, i) => row[h] = (cols[i] || '').replace(/^"|"$/g,''));
    return row;
  });
}

// ── Filters ───────────────────────────────────────────────────────────────
function applyFilters() {
  const q      = document.getElementById('search-box').value.toLowerCase();
  const lang   = document.getElementById('lang-filter').value;
  const status = document.getElementById('status-filter').value;

  filteredRows = allRows.filter(r => {
    const matchQ = !q || (r.url||'').toLowerCase().includes(q) ||
                         (r.language_name||'').toLowerCase().includes(q) ||
                         (r.detected_language||'').toLowerCase().includes(q);
    const matchL = !lang   || r.language_name === lang;
    const matchS = !status || r.status === status;
    return matchQ && matchL && matchS;
  });

  // Sort
  filteredRows.sort((a, b) => {
    let va = a[sortCol] || '', vb = b[sortCol] || '';
    if (!isNaN(va) && !isNaN(vb)) { va = +va; vb = +vb; }
    if (va < vb) return sortDir === 'asc' ? -1 :  1;
    if (va > vb) return sortDir === 'asc' ?  1 : -1;
    return 0;
  });

  currentPage = 1;
  renderTable();
  renderPagination();
}

// ── Table render ──────────────────────────────────────────────────────────
function renderTable() {
  if (!filteredRows.length) {
    document.getElementById('table-container').innerHTML =
      '<div class="loading" style="padding:40px">No results match your filters.</div>';
    return;
  }
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filteredRows.slice(start, start + PAGE_SIZE);

  const cols = [
    { key:'url',               label:'Stream URL' },
    { key:'detected_language', label:'Code' },
    { key:'language_name',     label:'Language' },
    { key:'confidence',        label:'Confidence' },
    { key:'ts_sampled',        label:'TS Sampled' },
    { key:'status',            label:'Status' },
    { key:'timestamp',         label:'Timestamp' },
  ];

  const th = cols.map(c => {
    const cls = c.key === sortCol ? sortDir : '';
    return `<th class="${cls}" onclick="sortBy('${c.key}')">
      ${c.label} <span class="sort-arrow">${c.key===sortCol ? (sortDir==='asc'?'↑':'↓') : '⇅'}</span>
    </th>`;
  }).join('');

  const rows = page.map(r => {
    const conf = parseFloat(r.confidence) || 0;
    const confPct = (conf * 100).toFixed(1);
    return `<tr>
      <td><div class="url-cell" title="${r.url}">${r.url}</div></td>
      <td><code>${r.detected_language||'—'}</code></td>
      <td>${r.language_name
        ? `<span class="lang-badge">🌐 ${r.language_name}</span>`
        : '—'}</td>
      <td>
        <div class="conf-bar">
          <div class="conf-track"><div class="conf-fill" style="width:${confPct}%"></div></div>
          <span style="font-size:.78rem;color:var(--muted);white-space:nowrap">${confPct}%</span>
        </div>
      </td>
      <td style="text-align:center">${r.ts_sampled||'—'}</td>
      <td class="status-${r.status}">${r.status==='ok'?'✅ ok':'❌ error'}</td>
      <td style="color:var(--muted);font-size:.78rem;white-space:nowrap">${r.timestamp||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('table-container').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>${th}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function sortBy(col) {
  if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortCol = col; sortDir = 'desc'; }
  applyFilters();
}

// ── Pagination ────────────────────────────────────────────────────────────
function renderPagination() {
  const total = Math.ceil(filteredRows.length / PAGE_SIZE);
  const pag   = document.getElementById('pagination');
  if (total <= 1) { pag.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for (let p = 1; p <= total; p++) {
    if (total > 7 && Math.abs(p - currentPage) > 2 && p !== 1 && p !== total) {
      if (p === 2 || p === total - 1) html += '<span style="color:var(--muted)">…</span>';
      continue;
    }
    html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
  pag.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  renderPagination();
}

// ── Stats cards ───────────────────────────────────────────────────────────
function updateStats() {
  const ok    = allRows.filter(r => r.status === 'ok');
  const err   = allRows.filter(r => r.status !== 'ok');
  const langs = new Set(ok.map(r => r.language_name).filter(Boolean));
  const avgConf = ok.length
    ? (ok.reduce((s, r) => s + (parseFloat(r.confidence)||0), 0) / ok.length * 100).toFixed(1)
    : '—';

  document.getElementById('stat-total').textContent = allRows.length;
  document.getElementById('stat-ok').textContent    = ok.length;
  document.getElementById('stat-err').textContent   = err.length;
  document.getElementById('stat-langs').textContent = langs.size;
  document.getElementById('stat-conf').textContent  = ok.length ? avgConf + '%' : '—';
}

// ── Language filter dropdown ───────────────────────────────────────────────
function populateLangFilter() {
  const langs  = [...new Set(allRows.map(r => r.language_name).filter(Boolean))].sort();
  const sel    = document.getElementById('lang-filter');
  const cur    = sel.value;
  sel.innerHTML = '<option value="">All languages</option>' +
    langs.map(l => `<option value="${l}" ${l===cur?'selected':''}>${l}</option>`).join('');
}

// ── Chart ─────────────────────────────────────────────────────────────────
function updateChart() {
  const ok     = allRows.filter(r => r.status === 'ok');
  const counts = {};
  ok.forEach(r => {
    const l = r.language_name || 'Unknown';
    counts[l] = (counts[l] || 0) + 1;
  });

  const sorted  = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const labels  = sorted.map(([l]) => l);
  const data    = sorted.map(([,n]) => n);
  const colors  = labels.map((_, i) => PALETTE[i % PALETTE.length]);

  const ctx = document.getElementById('langChart').getContext('2d');
  if (chartInst) chartInst.destroy();
  chartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Streams',
        data,
        backgroundColor: colors,
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.raw} stream${ctx.raw !== 1 ? 's' : ''}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#8892a4', precision: 0 },
        },
        y: {
          grid: { display: false },
          ticks: { color: '#e2e8f0', font: { size: 12 } },
        }
      }
    }
  });
}
</script>
</body>
</html>
